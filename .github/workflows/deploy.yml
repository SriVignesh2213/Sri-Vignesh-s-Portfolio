name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set site paths
        id: paths
        shell: bash
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          if [[ -n "$CUSTOM_SITE_URL" ]]; then
            base_path=""
            site_url="${CUSTOM_SITE_URL%/}"
          elif [[ "$repository" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            base_path=""
            site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          else
            base_path="/$repository"
            site_url="https://${GITHUB_REPOSITORY_OWNER}.github.io${base_path}"
          fi
          echo "base_path=$base_path" >> "$GITHUB_OUTPUT"
          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: vignesh-main
        run: bun install --frozen-lockfile

      - name: Build static site
        working-directory: vignesh-main
        run: bun run build
        env:
          SITE_URL: ${{ steps.paths.outputs.site_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.base_path }}

      - name: Disable Jekyll processing
        run: touch vignesh-main/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: vignesh-main/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
